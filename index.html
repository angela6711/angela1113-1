<script>
const categories = {expense:['餐飲','交通','購物','居住','娛樂','醫療','保險','訂閱','其他支出'],income:['薪水','獎金','投資','其他收入']};
const taipeiDate = (now = new Date()) => new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
function nextMonth(month){const [y,m]=month.split('-').map(Number);return `${y+(m===12?1:0)}-${String(m===12?1:m+1).padStart(2,'0')}`;}
function dueDate(month,day){const [y,m]=month.split('-').map(Number);return `${month}-${String(Math.min(day,new Date(Date.UTC(y,m,0)).getUTCDate())).padStart(2,'0')}`;}
function initialState(today=taipeiDate()){return {started:false,startMonth:today.slice(0,7),transactions:[],recurring:[],settlements:[],budget:3000000};}
function summarize(transactions){return transactions.reduce((s,t)=>{s[t.type]+=t.amount;return s;},{income:0,expense:0});}
function reconcile(state,today=taipeiDate()){
  const month=today.slice(0,7);let changed=false;
  for(const rule of state.recurring){
    if(!rule.active)continue;
    let cursor=rule.nextMonth;
    for(let limit=0;cursor<=month&&limit<1200;limit++){
      const date=dueDate(cursor,rule.day);if(date>today)break;
      if(!state.settlements.some(s=>s.month===cursor)&&!state.transactions.some(t=>t.recurringId===rule.id&&t.recurringMonth===cursor)){
        state.transactions.push({id:`fixed-${rule.id}-${cursor}`,type:'expense',amount:rule.amount,category:rule.category,note:rule.name,date,payment:rule.payment,recurringId:rule.id,recurringMonth:cursor});
      }
      cursor=nextMonth(cursor);rule.nextMonth=cursor;changed=true;
    }
  }
  let cursor=state.startMonth;
  for(let limit=0;cursor<month&&limit<1200;limit++){
    if(!state.settlements.some(s=>s.month===cursor)){
      const records=state.transactions.filter(t=>t.date.startsWith(cursor));const totals=summarize(records);
      const opening=state.settlements.filter(s=>s.month<cursor).sort((a,b)=>b.month.localeCompare(a.month))[0]?.closing||0;
      const breakdown={};for(const t of records.filter(t=>t.type==='expense'))breakdown[t.category]=(breakdown[t.category]||0)+t.amount;
      state.settlements.push({month:cursor,...totals,opening,closing:opening+totals.income-totals.expense,count:records.length,breakdown,closedAt:new Date().toISOString()});changed=true;
    }
    cursor=nextMonth(cursor);
  }
  return changed;
}
function requireValue(ok,message){if(!ok)throw new Error(message);}
function amount(value){requireValue(Number.isSafeInteger(value)&&value>0&&value<=100000000000,'請輸入有效金額（最高十億元）');return value;}
function text(value,max=100){return String(value||'').trim().slice(0,max);}
function validDate(value){return typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&!Number.isNaN(Date.parse(value))&&new Date(value+'T00:00:00Z').toISOString().slice(0,10)===value;}
function unlocked(state,date,today){requireValue(date.slice(0,7)>=state.startMonth,'日期早於帳本啟用月份');requireValue(date<=today,'未來扣款請使用固定支出');requireValue(!state.settlements.some(s=>s.month===date.slice(0,7)),'此月份已結帳，不能變更紀錄');}
function applyAction(state,action,today=taipeiDate()){
  const p=action.payload||{};
  if(action.type==='start'){state.started=true;return;}
  if(action.type==='budget'){requireValue(Number.isSafeInteger(p.amount)&&p.amount>=0&&p.amount<=100000000000,'預算金額無效');state.budget=p.amount;return;}
  if(action.type==='saveTransaction'){
    requireValue(categories[p.type]?.includes(p.category),'收支分類無效');requireValue(validDate(p.date),'請選擇有效日期');unlocked(state,p.date,today);
    const existing=state.transactions.find(t=>t.id===p.id);if(p.id)requireValue(existing,'找不到這筆紀錄');if(existing)unlocked(state,existing.date,today);
    const record={id:existing?.id||crypto.randomUUID(),type:p.type,amount:amount(p.amount),category:p.category,note:text(p.note),payment:text(p.payment,20)||'現金',date:p.date};
    if(existing?.recurringId){record.recurringId=existing.recurringId;record.recurringMonth=existing.recurringMonth;}
    if(p.fx){requireValue(typeof p.fx.original==='number'&&p.fx.original>0&&Number.isFinite(p.fx.original)&&typeof p.fx.rate==='number'&&p.fx.rate>0&&Number.isFinite(p.fx.rate),'換匯資料無效');record.fx={original:p.fx.original,rate:p.fx.rate,source:text(p.fx.source,50),updatedAt:text(p.fx.updatedAt,80),mode:text(p.fx.mode,10)};}
    if(existing)Object.assign(existing,record);else state.transactions.push(record);state.started=true;return;
  }
  if(action.type==='deleteTransaction'){
    const record=state.transactions.find(t=>t.id===p.id);requireValue(record,'找不到這筆紀錄');unlocked(state,record.date,today);state.transactions=state.transactions.filter(t=>t.id!==p.id);return;
  }
  if(action.type==='saveRecurring'){
    const existing=state.recurring.find(r=>r.id===p.id);if(p.id)requireValue(existing,'找不到固定支出');

function fxConverted(){const n=Number(fxValue);const r=activeRate();return r&&Number.isFinite(n)&&n>=0?(fxDirection==='JPY'?n*r:n/r):null;}
function renderFx(){const r=activeRate(),result=fxConverted();return `<div class="greeting"><div><div class="eyebrow">A LITTLE JOURNEY</div><h1>換個幣，繼續記。</h1><p class="date-note">日圓與台幣，輕鬆來回換算。</p></div><span class="fx-live"><span class="dot"></span>${rate?'最新牌告':'連線報價'}</span></div><section class="card" style="padding:21px"><div class="fx-mode"><span>換算方式</span><select aria-label="匯率種類" onchange="fxMode=this.value;render()"><option value="spot" ${fxMode==='spot'?'selected':''}>即期匯率</option><option value="cash" ${fxMode==='cash'?'selected':''}>現鈔匯率</option></select></div><div class="fx-box"><div class="fx-label"><span><span class="flag">${fxDirection==='JPY'?'🇯🇵':'🇹🇼'}</span>${fxDirection==='JPY'?'日圓':'新台幣'}</span><small>${fxDirection}</small></div><input id="fx-input" type="number" min="0" max="1000000000" step="any" inputmode="decimal" aria-label="要換算的金額" value="${esc(fxValue)}" oninput="fxValue=this.value;updateFx()"></div><button class="fx-swap" aria-label="切換換算方向" onclick="fxDirection=fxDirection==='JPY'?'TWD':'JPY';render()">${icon('swap')}</button><div class="fx-box" style="background:#edf2e7;border-color:#e5ecd9"><div class="fx-label"><span><span class="flag">${fxDirection==='JPY'?'🇹🇼':'🇯🇵'}</span>${fxDirection==='JPY'?'新台幣':'日圓'}</span><small>${fxDirection==='JPY'?'TWD':'JPY'}</small></div><div class="fx-result" id="fx-result">${result===null?'—':whole(result)}</div></div><div class="rate-info"><span id="rate-equation">${r?'1 JPY = '+r.toFixed(4)+' TWD':'正在取得最新匯率…'}</span><button onclick="fetchRate(true)" ${fxBusy?'disabled':''}>${icon('repeat')}${fxBusy?'更新中':'更新'}</button></div><div class="save-message">${rate?`來源：<a href="${esc(rate.sourceUrl)}" target="_blank" rel="noopener">${esc(rate.source)}</a><br>牌告時間：${esc(rate.updatedAt)}<br>${rate.notice?esc(rate.notice)+'<br>':''}${fxDirection==='JPY'?'日圓換台幣採銀行買入價。':'台幣換日圓採銀行賣出價。'}`:'匯率取得前不會使用預設數字。若網路暫時無法連線，請稍後重新更新。'}</div><button class="primary wide" ${result===null||Number(fxValue)<=0?'disabled':''} onclick="recordConverted()">${icon('plus')}將這筆支出記下來</button></section><div class="notice">${icon('info')}<span>取得來源最新可用報價，顯示實際更新時間。換算供記帳參考；銀行價差、刷卡手續費及實際成交金額可能不同。</span></div><p class="footer-note">小旅行的每一筆，也好好記下。</p>`;}
function updateFx(){const result=fxConverted();$('#fx-result').textContent=result===null?'—':whole(result);const b=$('.card .primary');if(b)b.disabled=result===null||Number(fxValue)<=0;}
async function fetchRate(force=false){if(fxBusy)return;fxBusy=true;if(tab==='fx')render();try{if(local){const res=await fetch('https://open.er-api.com/v6/latest/JPY');if(!res.ok)throw new Error();const d=await res.json();if(d.result!=='success'||!d.rates?.TWD)throw new Error();rate={spotBuy:d.rates.TWD,spotSell:d.rates.TWD,cashBuy:d.rates.TWD,cashSell:d.rates.TWD,source:'ExchangeRate-API',sourceUrl:'https://www.exchangerate-api.com',updatedAt:new Date(d.time_last_update_unix*1000).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}),notice:'每日更新參考匯率；不含銀行買賣價差。'};}else{const res=await fetch('/api/rate');const d=await res.json();if(!res.ok)throw new Error(d.error||'無法取得報價');rate=d;}if(force)toast('已取得來源最新可用報價');}catch(e){toast('目前無法取得匯率，請稍後重試');}finally{fxBusy=false;if(tab==='fx')render();}}
function recordConverted(){const result=fxConverted();if(result===null)return;const twd=fxDirection==='JPY'?result:Number(fxValue);openEntry('expense');$('#entry-amount').value=twd.toFixed(2);$('#entry-note').value='日圓換算支出';window.pendingFx={original:fxDirection==='JPY'?Number(fxValue):result,rate:activeRate(),source:rate.source,updatedAt:rate.updatedAt,mode:fxMode};$('#fx-entry-note').textContent=`原幣 ¥${whole(window.pendingFx.original)} · 1 JPY = ${activeRate()} TWD`;;}
function renderReports(){const current=totals();const closed=state.settlements.find(s=>s.month===selectedMonth);const sum=closed||{...current,count:monthRecords().length,opening:state.settlements.filter(s=>s.month<selectedMonth).sort((a,b)=>b.month.localeCompare(a.month))[0]?.closing||0};const closing=closed?closed.closing:sum.opening+sum.income-sum.expense;const breakdown=closed?.breakdown||monthRecords().filter(t=>t.type==='expense').reduce((s,t)=>(s[t.category]=(s[t.category]||0)+t.amount,s),{});return `<div class="top-title"><div class="eyebrow">A MONTH WELL SPENT</div><h1>每個月，好好收尾。</h1></div><p class="subtext">每月結束後，自動整理收入、支出與結餘。</p><div class="notice">${icon('check')}<span>${local?'本機版於開啟 App 時補做已結束月份的結帳。':'台北時間每月 1 日凌晨結算上個月。'}每月只結帳一次，結餘帶入下月；已結帳紀錄會鎖定保存。</span></div><div class="monthbar" style="margin-bottom:18px">${monthSwitch()}<button class="inline-button" onclick="exportCSV()">匯出明細</button></div><article class="card"><div class="report-month"><span>${monthTitle()}</span><span class="closed-badge" style="${closed?'':'background:#f4eddc;color:#a38b57'}">${closed?'已完成結帳':'本月進行中'}</span></div><div class="report-grid"><div><small>本月進帳</small><strong class="positive">+ ${cash(sum.income)}</strong></div><div><small>本月出帳</small><strong>− ${cash(sum.expense)}</strong></div><div><small>本月收支結餘</small><strong>${cash(sum.income-sum.expense)}</strong></div><div><small>上期累積結餘</small><strong>${cash(sum.opening)}</strong></div></div><div class="report-total"><span>累積結餘 <small>・${sum.count} 筆記錄</small></span><b>NT$ ${cash(closing)}</b></div>${Object.keys(breakdown).length?`<div class="breakdown"><small style="font-size:10px">本月支出去向</small>${Object.entries(breakdown).sort((a,b)=>b[1]-a[1]).map(([c,n],i)=>`<div class="breakdown-line"><span>${esc(c)}</span><span>${cash(n)} <small>(${Math.round(n/sum.expense*100)}%)</small></span></div><div class="track"><i style="width:${n/sum.expense*100}%;background:${colors[i%colors.length]}"></i></div>`).join('')}</div>`:''}${closed?`<p class="footer-note">結帳時間 ${new Date(closed.closedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})}</p>`:''}</article><h2 style="margin:24px 0 10px">過往月結</h2>${state.settlements.length?state.settlements.slice().sort((a,b)=>b.month.localeCompare(a.month)).map(s=>`<button class="row" onclick="selectedMonth='${s.month}';render()"><span class="category-icon income">${icon('report')}</span><span class="row-copy"><b>${monthTitle(s.month)}</b><small>${s.count} 筆記錄 · 已結帳</small></span><span class="row-amount">${cash(s.income-s.expense)}<small>本月結餘</small></span></button>`).join(''):`<div class="empty">${icon('report')}第一個月結束後，報表就會出現在這裡。</div>`}`;}
function renderSettings(){return `<div class="top-title"><div class="eyebrow">YOUR OWN LITTLE BOOK</div><h1>我的帳本</h1></div><p class="subtext">${local?(window.ledgerCloud?.config?'公開共用帳本：任何訪客皆可讀寫；本機另保留離線副本，請定期備份。':'本機版：資料儲存在目前瀏覽器，請定期下載備份。'):(canWrite?'雲端帳本：你可以編輯收支，其他訪客僅能瀏覽。':'公開瀏覽：可查看帳目與報表，修改功能僅限帳本擁有者。')}</p><div class="settings-list"><button onclick="downloadAppHtml()">${icon('download')}下載最新版手機 HTML<span class="arrow">${icon('right')}</span></button><button onclick="openBudget()">${icon('wallet')}每月預算<span class="arrow">NT$ ${cash(state.budget)}</span></button><button onclick="exportCSV()">${icon('download')}匯出本月 CSV 明細<span class="arrow">${icon('right')}</span></button><button onclick="downloadBackup()">${icon('shield')}下載完整 JSON 備份<span class="arrow">${icon('right')}</span></button>${local?`<button onclick="$('#import-file').click()">${icon('report')}還原 JSON 備份<span class="arrow">${icon('right')}</span></button>`:''}</div><div class="notice">${icon('info')}<span>${local?'下載版關閉後不會在背景執行；固定支出與月底結帳會於下次開啟時補做。清除瀏覽器資料會移除本機紀錄。':'結帳會保留月份快照，避免後續收支變更影響過往報表。固定支出僅代表記帳，不會實際從銀行扣款。'}</span></div><div class="settings-about">想飛記帳本 FLY LEDGER<br>把日子，慢慢存起來。<br><span style="font-size:9px">TWD · ASIA / TAIPEI · v2.0.0</span></div>`;}
function showSheet(content){$('#sheet').innerHTML=`<div class="handle"></div>${content}`;$('#modal').showModal();}
function sheetTitle(title){return `<div class="sheet-title"><h2>${title}</h2><button onclick="closeModal()" aria-label="關閉">${icon('close')}</button></div>`;}
function closeModal(){$('#modal').close();window.pendingFx=null;}
function paymentOptions(value='現金'){return ['現金','信用卡','銀行轉帳','電子支付'].map(v=>`<option ${v===value?'selected':''}>${v}</option>`).join('');}
function openEntry(type='expense',id=null,cat=null){window.pendingFx=null;modalType='entry';editingId=id;entryType=type;const t=state.transactions.find(t=>t.id===id);const closed=t&&(!canWrite&&!demo||state.settlements.some(s=>s.month===t.date.slice(0,7)));showSheet(`${sheetTitle(closed?(!canWrite&&!demo?'唯讀紀錄':'已結帳紀錄'):id?'編輯記錄':'記下這一筆')}<form id="entry-form"><div class="segment"><button type="button" onclick="setEntryType('expense')" class="${type==='expense'?'selected':''}">出帳</button><button type="button" onclick="setEntryType('income')" class="${type==='income'?'selected':''}">進帳</button></div><div class="form-amount"><span style="font-size:14px;color:#8a9688">NT$</span><input id="entry-amount" aria-label="金額" required type="number" min="0.01" max="1000000000" step="0.01" inputmode="decimal" placeholder="0" value="${t?t.amount/100:''}" ${closed?'readonly':''}></div><p id="fx-entry-note" class="save-message">${t?.fx?`原幣 ¥${whole(t.fx.original)} · 匯率 ${t.fx.rate}`:''}</p><div class="form-grid"><label class="field">分類<select id="entry-category" ${closed?'disabled':''}>${categories[type].map(c=>`<option ${c===(t?.category||cat)?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">日期<input id="entry-date" required type="date" min="${state.startMonth}-01" max="${today}" value="${t?.date||today}" ${closed?'readonly':''}></label></div><label class="field">名稱 / 備註<input id="entry-note" maxlength="100" placeholder="例如：午餐、十一月薪水" value="${esc(t?.note||'')}" ${closed?'readonly':''}></label><label class="field">付款方式<select id="entry-payment" ${closed?'disabled':''}>${paymentOptions(t?.payment||(type==='income'?'銀行轉帳':'現金'))}</select></label><p class="form-error" id="form-error" role="alert"></p>${closed?(!canWrite&&!demo?'<p class="notice">公開瀏覽模式，僅帳本擁有者能修改紀錄。</p>':'<p class="notice">這筆紀錄已列入月結報表，鎖定保存中。</p>'):`<button class="primary submit" type="submit">${icon('check')}儲存記錄</button>${id?`<button class="danger" type="button" onclick="confirmDelete('transaction','${id}')">刪除這筆記錄</button>`:''}`}<div id="delete-area"></div></form>`);$('#entry-form').onsubmit=saveEntry;}
function setEntryType(type){if(state.settlements.some(s=>s.month===state.transactions.find(t=>t.id===editingId)?.date.slice(0,7)))return;entryType=type;document.querySelectorAll('.segment button').forEach((b,i)=>b.classList.toggle('selected',i===(type==='expense'?0:1)));$('#entry-category').innerHTML=categories[type].map(c=>`<option>${c}</option>`).join('');}
async function saveEntry(e){e.preventDefault();const payload={id:editingId,type:entryType,amount:Math.round(Number($('#entry-amount').value)*100),category:$('#entry-category').value,date:$('#entry-date').value,note:$('#entry-note').value,payment:$('#entry-payment').value};if(window.pendingFx)payload.fx=window.pendingFx;else{const original=state.transactions.find(t=>t.id===editingId);if(original?.fx)payload.fx=original.fx;}if(await mutate('saveTransaction',payload)){closeModal();selectedMonth=payload.date.slice(0,7);render();toast(demo?'已儲存示範記錄':'已記下這一筆');}}
function openRule(id=null){if(!canWrite&&!demo){toast('公開瀏覽模式，僅可查看固定支出');return;}modalType='rule';editingId=id;const r=state.recurring.find(r=>r.id===id);showSheet(`${sheetTitle(r?'編輯固定支出':'新增固定支出')}<form id="rule-form"><label class="field">支出名稱<input id="rule-name" required maxlength="50" placeholder="例如：房租、保費、Netflix" value="${esc(r?.name||'')}"></label><div class="form-amount"><span class="muted">NT$</span><input id="rule-amount" aria-label="每月金額" required type="number" min="0.01" max="1000000000" step="0.01" inputmode="decimal" value="${r?r.amount/100:''}" placeholder="每月金額"></div><div class="form-grid"><label class="field">每月扣款日<select id="rule-day">${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${i+1===(r?.day||Number(today.slice(8)))?'selected':''}>每月 ${i+1} 日</option>`).join('')}</select></label><label class="field">分類<select id="rule-category">${categories.expense.map(c=>`<option ${c===(r?.category||'居住')?'selected':''}>${c}</option>`).join('')}</select></label></div><label class="field">${r?'設定從此月份起適用':'開始月份'}<input id="rule-start" required type="month" min="${today.slice(0,7)}" max="2100-12" value="${r&&r.nextMonth>today.slice(0,7)?r.nextMonth:today.slice(0,7)}"></label><label class="field">付款方式<select id="rule-payment">${paymentOptions(r?.payment||'銀行轉帳')}</select></label><p class="save-message">若本月扣款日已過，儲存時會立即產生本月支出。修改僅影響尚未入帳的期數。</p><p class="form-error" id="form-error" role="alert"></p><button type="submit" class="primary submit">${icon('check')}儲存固定支出</button>${r?`<button class="danger" type="button" onclick="confirmDelete('rule','${id}')">移除固定支出</button>`:''}<div id="delete-area"></div></form>`);$('#rule-form').onsubmit=async e=>{e.preventDefault();if(await mutate('saveRecurring',{id:editingId,name:$('#rule-name').value,amount:Math.round(Number($('#rule-amount').value)*100),day:Number($('#rule-day').value),category:$('#rule-category').value,payment:$('#rule-payment').value,startMonth:$('#rule-start').value})){closeModal();render();toast('固定支出已儲存');}};}
function openBudget(){if(!canWrite&&!demo){toast('公開瀏覽模式，僅可查看預算');return;}showSheet(`${sheetTitle('每月預算')}<form id="budget-form"><p class="subtext">為每個月留一點餘裕。此設定套用於月度總覽。</p><label class="field">每月可用預算（新台幣）<input id="budget-input" required inputmode="decimal" type="number" min="0" max="1000000000" step="0.01" value="${state.budget/100}"></label><p class="form-error" id="form-error" role="alert"></p><button type="submit" class="primary submit">儲存預算</button></form>`);$('#budget-form').onsubmit=async e=>{e.preventDefault();if(await mutate('budget',{amount:Math.round(Number($('#budget-input').value)*100)})){closeModal();render();toast('預算已更新');}};}
function confirmDelete(kind,id){$('#delete-area').innerHTML=`<div class="delete-confirm">${kind==='rule'?'移除後會停止未來自動入帳，保留已產生紀錄。':'確定刪除這筆紀錄？此操作無法還原。'}<div><button type="button" onclick="$('#delete-area').innerHTML=''">保留</button><button type="button" onclick="deleteItem('${kind}','${id}')">確定刪除</button></div></div>`;}
async function deleteItem(kind,id){if(await mutate(kind==='rule'?'deleteRecurring':'deleteTransaction',{id})){closeModal();render();toast('已刪除');}}
function download(name,content,type){const link=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type}));link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csvCell(v){let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}
function exportCSV(){const fields=['日期','收支','分類','名稱','台幣金額','付款方式','原始日圓','使用匯率'];const rows=monthRecords().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='income'?'進帳':'出帳',t.category,t.note,t.amount/100,t.payment,t.fx?.original||'',t.fx?.rate||'']);download(`想飛記帳本-${selectedMonth}${demo?'-示範':''}.csv`,'\ufeff'+[fields,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('明細已匯出');}
function downloadAppHtml(){const link=document.createElement('a');link.href='./想飛記帳本-手機版.html';link.download='想飛記帳本-手機版.html';document.body.appendChild(link);link.click();link.remove();}
function downloadBackup(){download(`想飛記帳本-備份-${today}${demo?'-示範':''}.json`,JSON.stringify({app:'daily-ledger',schema:1,exportedAt:new Date().toISOString(),state},null,2),'application/json');}
$('#import-file').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const backup=JSON.parse(await file.text());if(backup.app!=='daily-ledger'||backup.schema!==1||!Array.isArray(backup.state?.transactions)||!Array.isArray(backup.state?.recurring)||!Array.isArray(backup.state?.settlements))throw new Error('備份格式不正確');showSheet(`${sheetTitle('還原備份')}<p class="subtext">這份備份包含 ${backup.state.transactions.length} 筆紀錄。還原將取代目前本機帳本。</p><button class="primary wide" id="restore-confirm">確認取代並還原</button>`);$('#restore-confirm').onclick=()=>{try{localStorage.setItem(LOCAL_KEY,JSON.stringify(backup.state));window.ledgerCloud?.changed();realState=backup.state;state=realState;demo=false;closeModal();load();toast('已還原備份');}catch(e){toast('儲存失敗，資料未還原');}};}catch(e){toast(e.message);}e.target.value='';};
$('#settings').onclick=()=>navigate('settings');$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal();});
// Reconcile after midnight and when returning to the app. The cloud schedule also runs while closed.
setInterval(async()=>{const date=taipeiDate();if(date!==today&&!busy){today=date;await load();}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#modal').open&&!demo&&!busy)load();});
load();
</script></body></html>
